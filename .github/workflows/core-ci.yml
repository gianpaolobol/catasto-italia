name: Building Core CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Runtime and contract tests
        run: |
          node --version
          node --test tests/*.test.mjs
