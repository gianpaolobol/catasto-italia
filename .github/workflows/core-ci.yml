name: Building Core CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Local PDF extractor prerequisites
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          pdftotext -v
          pdfinfo -v
      - name: Italian OCR prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ita
          tesseract --version
          tesseract --list-langs | grep -Fx ita
      - name: Runtime and contract tests
        run: |
          node --version
          node --test tests/*.test.mjs
